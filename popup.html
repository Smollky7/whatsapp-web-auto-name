<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Identificação de Mensagens</title>

  <style>
    /* ===============================
       RESET BÁSICO
       =============================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #0b141a;
      color: #e9edef;
    }

    /* ===============================
       CONTAINER PRINCIPAL
       =============================== */
    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ===============================
       TOPO / CABEÇALHO
       =============================== */
    .topbar {
      background: #1f2c33;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #111b21;
    }

    .topbar .badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #25d366, #128c7e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .topbar .titles h1 {
      font-size: 15px;
      font-weight: 600;
    }

    .topbar .titles span {
      font-size: 12px;
      color: #8696a0;
    }

    /* ===============================
       CONTEÚDO
       =============================== */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: #111b21;
      border-radius: 10px;
      overflow: hidden;
    }

    /* ===============================
       TOGGLE
       =============================== */
    .switch-row {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .switch-row:active {
      background: #182229;
    }

    .switch-row .label {
      font-size: 14px;
    }

    .switch {
      position: relative;
      width: 50px;
      height: 28px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #2a3942;
      border-radius: 14px;
      transition: .2s;
    }

    .slider::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #8696a0;
      border-radius: 50%;
      top: 4px;
      left: 4px;
      transition: .2s;
    }

    input:checked + .slider {
      background: #25d366;
    }

    input:checked + .slider::after {
      transform: translateX(22px);
      background: #fff;
    }

    /* ===============================
       INPUT DE TEXTO
       =============================== */
    .field {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      color: #8696a0;
    }

    .field input {
      background: #202c33;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 12px;
      color: #e9edef;
      font-size: 14px;
    }

    .field input:focus {
      outline: none;
      border-color: #25d366;
      background: #2a3942;
    }

    /* ===============================
       PRÉVIA
       =============================== */
    .preview {
      padding: 16px;
    }

    .preview h3 {
      font-size: 11px;
      color: #8696a0;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: .5px;
    }

    .bubble-area {
      background: #0d1418;
      border-radius: 10px;
      padding: 16px;
    }

    .bubble {
      background: #144d37;
      padding: 8px 10px;
      border-radius: 8px;
      border-top-right-radius: 0;
      width: fit-content;
      margin-left: auto;
      font-size: 14px;
      white-space: pre-line;
    }

    .bubble strong {
      font-weight: 700;
    }

    /* ===============================
       BOTÃO
       =============================== */
    .actions {
      padding: 16px;
      padding-top: 4px;
    }

    .actions button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #25d366;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }

    .actions button:hover {
      background: #1fb95a;
    }

    .saved {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      color: #25d366;
      display: none;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- Cabeçalho -->
    <div class="topbar">
      <div class="badge">📝</div>
      <div class="titles">
        <h1>Identificação</h1>
        <span>Configuração rápida</span>
      </div>
    </div>

    <!-- Conteúdo -->
    <div class="content">

      <!-- Toggle -->
      <div class="card" id="toggleRow">
        <div class="switch-row">
          <span class="label">Usar identificação automática</span>
          <label class="switch">
            <input type="checkbox" id="enabledToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Nome -->
      <div class="card">
        <div class="field">
          <label for="prefixInput">Nome ou empresa</label>
          <input
            id="prefixInput"
            type="text"
            placeholder="Ex: João - Suporte"
            maxlength="50"
          />
        </div>
      </div>

      <!-- Prévia -->
      <div class="card preview">
        <h3>Visualização</h3>
        <div class="bubble-area">
          <div class="bubble" id="previewText"></div>
        </div>
      </div>

      <!-- Ações -->
      <div class="actions">
        <button id="saveBtn">Salvar alterações</button>
        <div class="saved" id="successMsg">Configuração salva ✔</div>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
