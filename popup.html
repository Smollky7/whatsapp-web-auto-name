<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <h2>WhatsApp Nome</h2>

  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>

  <input type="text" id="nameInput" placeholder="Digite seu nome">

  <div class="preview">
    <div class="bubble">
      <strong id="previewName">Nome:</strong><br>
      <em>Mensagem de exemplo</em>
    </div>
  </div>

  <button id="save">Salvar</button>

  <script src="popup.js"></script>
</body>
</html>
