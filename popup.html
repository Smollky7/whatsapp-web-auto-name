<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assinatura | WhatsApp Web Auto Name</title>

  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="mark" aria-hidden="true">MSG</div>
      <div>
        <p class="eyebrow">WHATSAPP WEB · PRÉVIA</p>
        <h1>Identificação</h1>
      </div>
    </header>

    <form class="content" id="settingsForm">
      <section class="section preview-section" aria-labelledby="previewHeading">
        <div class="section-heading">
          <h2 id="previewHeading">Prévia da conversa</h2>
          <span class="meta">AO VIVO</span>
        </div>
        <div class="preview">
          <div class="preview-frame stage" id="stage" aria-label="Mensagem de exemplo">
            <button class="replay" id="replayBtn" type="button" aria-label="Repetir animação da mensagem" title="Repetir animação">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7" />
                <path d="M3 4v5h5" />
              </svg>
            </button>
            <div class="thread">
              <div class="typing" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="bubble" id="bubble">
                <div class="name-collapse" id="nameCollapse">
                  <div class="name-inner"><strong class="sender" id="previewLabel"></strong></div>
                </div>
                <p class="message-body">Olá, tudo bem?</p>
                <span class="bubble-meta">
                  <time id="previewTime">12:00</time>
                  <svg class="ticks" viewBox="0 0 18 11" width="17" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 6l3 3L10 2" />
                    <path d="M7 8l1.2 1.2L15 2" />
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="toggleHeading">
        <div class="section-heading">
          <h2 id="toggleHeading">Automação</h2>
          <span class="meta">LOCAL</span>
        </div>
        <div class="toggle-row">
          <div class="toggle-copy">
            <label for="enabledToggle">Adicionar identificador</label>
            <span>Aplicar ao texto enviado pelo usuário</span>
          </div>
          <label class="switch">
            <input id="enabledToggle" type="checkbox" aria-label="Adicionar identificador automaticamente" />
            <span class="track" aria-hidden="true"></span>
          </label>
        </div>
      </section>

      <section class="section" aria-labelledby="nameHeading">
        <div class="section-heading">
          <h2 id="nameHeading">Identificador</h2>
          <span class="meta">MÁX. 50</span>
        </div>
        <div class="field">
          <div class="field-meta">
            <label for="prefixInput">Nome ou empresa</label>
            <span class="count" id="characterCount" aria-live="polite">0/50</span>
          </div>
          <input id="prefixInput" type="text" placeholder="Ex.: Joana | Suporte" maxlength="50" autocomplete="off" />
        </div>
      </section>

      <div class="actions">
        <button id="saveBtn" type="submit"><span id="saveLabel">Salvar alterações</span></button>
        <p class="status" id="statusMessage" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="privacy-note">As preferências ficam neste navegador.</p>
      </div>
    </form>
  </main>

  <script src="signature-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
